plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

group = mod_group
version = mod_version

base {
    archivesName = 'northstar-curios-compat'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property("mixin.env.remapRefMap", "true")
            property("mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg")
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property("mixin.env.remapRefMap", "true")
            property("mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg")
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/mirror' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex 'software\\.bernie.*'
            includeGroup 'com.eliotlash.mclib'
        }
    }
    maven {
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("maven.modrinth:northstar-redux:${northstar_redux_version}")
    implementation fg.deobf("curse.maven:curios-${curios_cf}")
    compileOnly fg.deobf("curse.maven:kubejs-238086:5853326")
    compileOnly fg.deobf("curse.maven:rhino-416294:6186971")
    implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false })
    implementation fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation "io.github.llamalad7:mixinextras-forge:0.4.1"
    runtimeOnly fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'northstar_curios_compat.refmap.json'
    config 'northstar_curios_compat.mixins.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    dependsOn tasks.named('createMcpToSrg')
    options.compilerArgs += [
        "-AreobfTsrgFile=${rootProject.file('build/createMcpToSrg/output.tsrg').absolutePath}",
        "-AdefaultObfuscationEnv=searge"
    ]
}

def generatedMixinRefmap = layout.buildDirectory.file('generated/mixin/northstar_curios_compat.refmap.json')

tasks.named('compileJava', JavaCompile).configure {
    outputs.file(generatedMixinRefmap)
    doFirst {
        def refmapFile = generatedMixinRefmap.get().asFile
        refmapFile.parentFile.mkdirs()
        options.compilerArgs.removeAll { it.startsWith('-AoutRefMapFile=') }
        options.compilerArgs.add("-AoutRefMapFile=${refmapFile.absolutePath}")
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar {
    from(generatedMixinRefmap)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            'Specification-Title': mod_name,
            'Specification-Version': mod_version,
            'Implementation-Title': project.name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': mod_authors,
            'MixinConfigs': 'northstar_curios_compat.mixins.json'
        )
    }
}

tasks.register('verifyMixinRefmap') {
    group = 'verification'
    description = 'Verifies that the release jar contains the remapped oxygen injection targets.'
    dependsOn tasks.named('jar')
    doLast {
        def archiveFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        new java.util.jar.JarFile(archiveFile).withCloseable { archive ->
            def entry = archive.getJarEntry('northstar_curios_compat.refmap.json')
            if (entry == null) {
                throw new GradleException('Release jar is missing the Mixin refmap.')
            }
            def refmap = archive.getInputStream(entry).withCloseable { stream ->
                new groovy.json.JsonSlurper().parse(stream)
            }
            def targets = [
                'renderItemDecorations(Lnet/minecraft/client/gui/Font;Lnet/minecraft/world/item/ItemStack;IILjava/lang/String;)V',
                'Lnet/minecraft/world/item/ItemStack;isEmpty()Z'
            ]
            targets.each { target ->
                def mapped = refmap.mappings?.values()?.any { mappings ->
                    mappings[target] instanceof String && mappings[target].contains('m_')
                }
                if (!mapped) {
                    throw new GradleException("Mixin refmap is missing the SRG mapping for ${target}.")
                }
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyMixinRefmap')
}
