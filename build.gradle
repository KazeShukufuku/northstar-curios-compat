plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}

group = mod_group
version = mod_version

base {
    archivesName = 'northstar-curios-compat-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        modSource project.sourceSets.main
    }
    client { }
    server { }
}

tasks.matching { it.name.startsWith('writeMinecraftClasspath') }.configureEach {
    outputs.upToDateWhen { false }
    doLast {
        def classpathFile = output.get().asFile
        def legacyAsm95 = ~/.*[\\\/]org\.ow2\.asm[\\\/](asm|asm-analysis|asm-tree|asm-util)[\\\/]9\.5[\\\/].*/
        def filteredLines = classpathFile.readLines('UTF-8').findAll { !(it ==~ legacyAsm95) }
        classpathFile.write(filteredLines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
    }
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com' }
    maven { url = 'https://maven.ithundxr.dev/mirror' }
    maven {
        url = 'https://maven.ithundxr.dev/snapshots'
        content {
            includeGroup 'com.tterrag.registrate'
        }
    }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex 'software\\.bernie.*'
            includeGroup 'com.eliotlash.mclib'
        }
    }
    maven {
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    implementation "curse.maven:northstar-redux-${northstar_redux_cf}"
    implementation "curse.maven:curios-${curios_cf}"
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.fork = true
    options.forkOptions.jvmArgs += [
        '-Dfile.encoding=UTF-8',
        '-Dstdout.encoding=UTF-8',
        '-Dstderr.encoding=UTF-8'
    ]
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            'Specification-Title': mod_name,
            'Specification-Version': mod_version,
            'Implementation-Title': project.name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': mod_authors,
            'MixinConfigs': 'northstar_curios_compat.mixins.json'
        )
    }
}
